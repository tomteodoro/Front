<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Eventos</title>

</head>

<body>
    <header>
        <h1>Buscador de Eventos</h1>
    </header>


    <main>

        <section class="busca">

            <div class="form-busca">

                <input type="text" id="cidade" placeholder="Digite a cidade">

                <button id="btnBuscar">
                    Buscar eventos
                </button>

            </div>

        </section>


        <p id="status"></p>


        <section id="resultado" class="eventos">

            <!-- Os eventos serão inseridos aqui pelo JavaScript -->

        </section>

    </main>


    <!-- <footer>
        <p>
            Projeto desenvolvido com JavaScript e API de eventos.
        </p>
    </footer> -->


    <script src="script.js"></script>

</body>

</html>
